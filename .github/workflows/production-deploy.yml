name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      routing:
        description: Activate Apache routing after deployment and health checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false
  queue: single

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    outputs:
      eligible: ${{ steps.admission.outputs.eligible }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v4

      - name: Verify the exact release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/verify_release_target.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"

      - name: Record the source tree
        if: steps.target.outputs.eligible == 'true'
        id: tree
        run: echo "sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Find a complete immutable release
        id: existing
        if: steps.target.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_SHA: ${{ steps.tree.outputs.sha }}
        run: python3 deploy/publish_release.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tree "$TREE_SHA" --check

      - name: Set up frontend build tools
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Go
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.sum

      - name: Install frontend dependencies
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        run: npm ci

      - name: Set up documentation build tools
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the existing Markdown compiler
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        run: python3 -m pip install "$(sed -n '/^Markdown==/p' requirements.txt)"

      - name: Build and verify the React public host
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        run: |
          set -euo pipefail
          npm run app:build
          node scripts/verify_public_host.mjs

      - name: Pack the React host bundle
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/app.tar.gz" frontend/server.mjs frontend/public-availability.mjs frontend/dist

      - name: Build the Go public API
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go -C go-api build -trimpath \
              -ldflags="-s -w -X main.buildSHA=${GITHUB_SHA}" \
              -o "$RUNNER_TEMP/api" .

      - name: Write the release manifest
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"])
          assets = {}
          for name in ("api", "app.tar.gz"):
              data = (output / name).read_bytes()
              assets[name] = {
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }
          manifest = {
              "schema": 1,
              "commit": os.environ["GITHUB_SHA"],
              "tree": os.environ["TREE_SHA"],
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "assets": assets,
          }
          (output / "release.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          cat "$RUNNER_TEMP/release.json"
        env:
          TREE_SHA: ${{ steps.tree.outputs.sha }}

      - name: Publish immutable release assets
        if: steps.target.outputs.eligible == 'true' && steps.existing.outputs.reusable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_SHA: ${{ steps.tree.outputs.sha }}
        run: python3 deploy/publish_release.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tree "$TREE_SHA" --publish --directory "$RUNNER_TEMP"

      - name: Recheck admission after artifact preparation
        id: admission
        if: steps.target.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/verify_release_target.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"

  deploy:
    needs: release
    if: needs.release.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      SSH_OPTIONS: -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=5
      ACTIVATE_ROUTING: ${{ github.event_name == 'push' || inputs.routing }}

    steps:
      - name: Check out deployment verifier
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SSH_HOST"
          test -n "$PRODUCTION_SSH_USER"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Trust production host
        env:
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Deploy Flask, the React host and the Go API
        id: deploy_origin
        run: |
          set -euo pipefail
          command=deploy
          if [[ "$ACTIVATE_ROUTING" == true ]]; then command=deploy-routing; fi
          ssh $SSH_OPTIONS "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "$command $GITHUB_SHA"
          # The SSH command verifies every service it started and the exact
          # build SHA before returning success.
          echo "verified_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          python3 deploy/verify_health_sha.py \
            "$GITHUB_SHA" "https://mielenosoitukset.fi/health" \
            --origin-verified-sha "${{ steps.deploy_origin.outputs.verified_sha }}" \
            --attempts 15 --delay 2 --timeout 10

      - name: Verify public API endpoint
        run: |
          set -euo pipefail
          python3 deploy/verify_health_sha.py \
            "$GITHUB_SHA" "https://api.mielenosoitukset.fi/health" \
            --attempts 15 --delay 2 --timeout 10
