# Application Configuration
SECRET_KEY: "not_a_secret"  # Secret key for session management
MONGO_URI: "mongodb://mongo:27018"  # MongoDB connection URI
MONGO_DBNAME: "miekkari_db"  # Name of the MongoDB database
MAIL:
  SERVER: "mailserver"  # SMTP server for sending emails
  PORT: 1025  # SMTP port, typically 587 for TLS
  USE_TLS: false  # Enable TLS for secure email sending
  USERNAME: "example@example.com"  # SMTP username
  PASSWORD: "example_password"  # SMTP password
  DEFAULT_SENDER: "example@example.com"  # Default sender email address

# Contact-form security defaults; local tests may override the form-age delay.
CONTACT_FORM_ENABLED: true
CONTACT_PER_IP_LIMIT: "3 per 10 minutes; 10 per day"
CONTACT_GLOBAL_LIMIT: "25 per 10 minutes; 100 per day"
CONTACT_MIN_FORM_SECONDS: 2
CONTACT_FORM_TOKEN_MAX_AGE_SECONDS: 7200
CONTACT_FORM_MAX_OUTSTANDING_TOKENS: 5
CONTACT_MAX_REQUEST_BYTES: 16384
CONTACT_NAME_MAX_LENGTH: 120
CONTACT_EMAIL_MAX_LENGTH: 254
CONTACT_MESSAGE_MIN_LENGTH: 10
CONTACT_MESSAGE_MAX_LENGTH: 5000
TICKET_AUTO_REPLY_ENABLED: false

# These are needed for admin confirmation email generation
SERVER_NAME: "miekkari.localhost"  # host name for dev (same as in /etc/hosts)
PREFERRED_URL_SCHEME: "https"  # URL scheme (e.g., https)

PORT: 5002  # Application port
DEBUG: true  # Enable debugging mode for development
# SOS! Disable debug mode in production! 
# Debug mode exposes sensitive information and is not suitable for production environments!
# https://flask.palletsprojects.com/en/stable/config/#DEBUG

CDN_BASE_URL: "https://cdn.miekkari.localhost"

CACHE_TYPE: "SimpleCache"
ENABLE_CHAT: false

# Facebook event import (Apify). Leave empty to disable the feature.
# APIFY_API_TOKEN: "your_apify_api_token"
# APIFY_FACEBOOK_ACTOR_ID: "apify~facebook-events-scraper"

# S3 Configuration
S3:
  ACCESS_KEY: "example_access_key"  # Access key for S3
  SECRET_KEY: "example_secret_key"  # Secret key for S3
  ENDPOINT_URI: "http://localstack:4566"  # S3 endpoint URL

BABEL:
  DEFAULT_LOCALE: "fi"  # Default locale for the application
  SUPPORTED_LOCALES:
    - "fi"
    - "en"
  PUBLIC_LOCALES:
    - "fi"
  LANGUAGES:
    fi: "Suomi"
    en: "English"
