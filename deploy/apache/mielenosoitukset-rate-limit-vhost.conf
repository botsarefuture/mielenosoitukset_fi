# Include these directives inside the mielenosoitukset.fi TLS VirtualHost,
# before the catch-all ProxyPass "/" rule. The local ErrorDocument keeps the
# original 403 status. mod_evasive skips Apache internal redirects (r->prev),
# so the lightweight static response remains available to a blocked client.
# ProxyErrorOverride stays off so application-generated authorization errors
# retain their own Flask response instead of being replaced by this document.

ProxyPass "/__rate-limit.html" "!"
Alias "/__rate-limit.html" "/var/www/mielenosoitukset-error-pages/rate-limit.html"

<Location "/__rate-limit.html">
    Require all granted
    Header always set Cache-Control "no-store"
    Header always set Retry-After "60"
</Location>

ProxyErrorOverride Off
ErrorDocument 403 /__rate-limit.html
