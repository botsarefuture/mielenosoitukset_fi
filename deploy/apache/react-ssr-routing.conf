# React public app routing
#
# Include these directives inside the mielenosoitukset.fi TLS VirtualHost,
# before the existing catch-all ProxyPass "/" rule.
#
# Only GET/HEAD requests for routes the React app owns are sent to the app host.
# Everything else keeps its current handler:
#   POST /submit -> Go; other form posts/login/logout -> Flask
#   /admin, /users, /api, /static, feeds, sitemap, robots      -> Flask
#   every page route not listed below                          -> Flask
#
# Rollout and rollback: remove or comment this include. No data changes.
#
# The app host renders metadata only. Page bodies render in the browser, so a
# migrated page response does not query MongoDB.

RewriteEngine On

# App bundle assets are always served by the app host.
ProxyPass        "/app-assets/" "http://127.0.0.1:8090/app-assets/" retry=0
ProxyPassReverse "/app-assets/" "http://127.0.0.1:8090/app-assets/"

# Migrated page GETs. Add one rule per route when its page leaves Flask.
# Keep method conditions so page hosting does not take ownership of mutations.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/$" "http://127.0.0.1:8090/" [P,L]

# Authentication remains in Flask. Only the private React screen is hosted here.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/auth/god$" "http://127.0.0.1:8090/auth/god" [P,L]

# Activate only after Go intake and the Flask delivery worker are configured.
# The nested Facebook import endpoint retains its Flask handler.
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/submit$" "http://127.0.0.1:8091/api/submissions" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/submit$" "http://127.0.0.1:8090/submit" [P,L]

# Month/year calendars, including canonical city-scoped views. GET/HEAD only.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/calendar(/[0-9]{4}(/[0-9]{1,2})?)?/?$" "http://127.0.0.1:8090$0" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/city/[^/]+/calendar(/[0-9]{4}(/[0-9]{1,2})?)?/?$" "http://127.0.0.1:8090$0" [P,L]

# City discovery and today's listings. Only these exact GET/HEAD routes move.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/(cities|mielenosoitukset-tanaan|city/[^/]+/tanaan)$" "http://127.0.0.1:8090$0" [P,L]

# Ordinary listings. Other nested paths keep their existing handlers.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/(demonstrations|city/[^/]+|tag/[^/]+)$" "http://127.0.0.1:8090$0" [P,L]

# Pride page and its two existing aliases.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/(pride-nakyvaksi|pride/?)$" "http://127.0.0.1:8090$0" [P,L]

# Public organization profiles only. Fill forms, administration and writes retain
# their existing Flask handlers and authorization checks.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/organization/[a-fA-F0-9]{24}$" "http://127.0.0.1:8090$0" [P,L]

# Demonstration detail and series pages, approved for activation by the maintainer.
#
# Exactly one path segment is claimed: /demonstration/<id>/ics,
# a trailing slash keep their Flask handler. The children route is listed below.
# `preview=1` is how the app host hands a nonpublic event back to the existing
# signed-in preview workflow, so it must reach Flask and is excluded here.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteCond %{QUERY_STRING} "!(^|&)preview=1(&|$)"
RewriteRule "^/demonstration/[^/]+$" "http://127.0.0.1:8090$0" [P,L]
#
# The recurring-series page keeps its `?occurrence=` query string, which the host
# uses to select the occurrence and the browser uses for in-page navigation.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteCond %{QUERY_STRING} "!(^|&)preview=1(&|$)"
RewriteRule "^/demonstration/[^/]+/children$" "http://127.0.0.1:8090$0" [P,L]

# Forward the session cookie unchanged so the app can read the existing
# Flask /api/session summary. No header is added or trusted from the client.
# The app host is told its public origin with its own APP_ORIGIN setting.
ProxyPreserveHost On

# The app host sends its own no-store and nosniff headers for page responses.
# Do not cache HTML in the web server; hashed app assets are cached by the app.
