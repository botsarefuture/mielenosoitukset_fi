<VirtualHost *:80>
    ServerName api.mielenosoitukset.fi
    DocumentRoot /var/lib/mielenosoitukset-api-acme
    Alias /.well-known/acme-challenge/ /var/lib/mielenosoitukset-api-acme/.well-known/acme-challenge/
    <Directory /var/lib/mielenosoitukset-api-acme>
        Require all granted
        Options -Indexes
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://api.mielenosoitukset.fi%{REQUEST_URI} [R=301,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/mielenosoitukset_api_error.log
    CustomLog ${APACHE_LOG_DIR}/mielenosoitukset_api_access.log combined
</VirtualHost>
