<VirtualHost *:443>
    ServerName api.mielenosoitukset.fi
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/api.mielenosoitukset.fi/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.mielenosoitukset.fi/privkey.pem
    Include /etc/mielenosoitukset-api/cloudflare-origin.conf
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyErrorOverride Off
    ProxyPass / http://127.0.0.1:8091/ connectiontimeout=3 timeout=10
    ProxyPassReverse / http://127.0.0.1:8091/
    Header always set Strict-Transport-Security "max-age=31536000"
    # Do not set Cache-Control here. `Header always ...` writes err_headers_out,
    # which Apache merges into the proxied response instead of replacing it, so a
    # `no-store` here shipped beside the API's own policy and blocked both the
    # browser max-age and the CDN s-maxage. The API sets Cache-Control on every
    # response: no-store by default, public with max-age/s-maxage on cached reads.
    ErrorLog ${APACHE_LOG_DIR}/mielenosoitukset_api_error.log
    CustomLog ${APACHE_LOG_DIR}/mielenosoitukset_api_access.log combined
</VirtualHost>
