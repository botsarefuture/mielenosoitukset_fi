{# Shared controls for user-facing demonstration listings. #}
{% macro load_more_button(button_id='load-more-btn', label='') %}
  <p id="listing-result-summary" class="public-listing-summary" role="status" aria-live="polite" aria-atomic="true" hidden
     data-format="{{ _('Näytetään %(start)s–%(end)s / %(count)s mielenosoituksesta', start='__START__', end='__END__', count='__COUNT__') }}"></p>
  <div id="listing-load-error" class="public-listing-summary" hidden>
    <p role="alert">{{ _('Mielenosoitusten lataaminen epäonnistui. Yritä uudelleen.') }}</p>
    <button type="button" class="button button-secondary">{{ _('Yritä uudelleen') }}</button>
  </div>
  <button id="{{ button_id }}" class="button button-secondary load-more" hidden>
    {{ label or _('Näytä lisää') }}
  </button>
{% endmacro %}

{% macro listing_end_message(message_id='end-of-content-message') %}
  <div id="{{ message_id }}" class="end-of-content-message" hidden></div>
{% endmacro %}
