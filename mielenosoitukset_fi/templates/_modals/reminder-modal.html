{% macro render_reminder_modal(demo) %}
<div class="modal fade user-modal" id="reminder-modal" tabindex="-1" aria-labelledby="reminderModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg border-0 rounded-3">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="reminderModalLabel">
          <i class="fas fa-bell me-2 text-primary"></i> {{ _('Tilaa muistutus sähköpostiisi') }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ _('Sulje') }}"></button>
      </div>

      <div class="modal-body">
        <form id="reminder-form" method="POST"
              action="{{ url_for('subscribe_reminder', demo_id=demo['_id']) }}"
              class="user-form d-flex flex-column gap-3">
          <label class="form-label" for="reminder-email">{{ _('Sähköpostiosoite') }}</label>
          <input type="email" name="user_email" id="reminder-email"
                 class="form-control"
                 placeholder="{{ _('Sähköpostiosoite') }}" required>
          
          <button type="submit" class="btn btn-primary w-100 d-flex justify-content-center align-items-center gap-2">
            <span class="btn-text">{{ _('Tilaa muistutus') }}</span>
            <span class="spinner-border spinner-border-sm d-none" id="reminder-loading" role="status" aria-hidden="true"></span>
          </button>
        </form>
        
        <div id="reminder-result" class="user-form-feedback" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden>
          <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          <p id="reminder-result-text"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("reminder-form");
  const result = document.getElementById("reminder-result");
  const resultText = document.getElementById("reminder-result-text");
  const resultIcon = result.querySelector("i");
  const btn = form.querySelector("button");
  const btnText = btn.querySelector(".btn-text");
  const spinner = document.getElementById("reminder-loading");
  const emailInput = document.getElementById("reminder-email");
  const modalEl = document.getElementById("reminder-modal");
  const bootstrapModal = bootstrap.Modal.getOrCreateInstance(modalEl);
  let closeTimer = null;

  function setFeedback(tone, message, countdown = null) {
    result.classList.remove("user-form-feedback--success", "user-form-feedback--error");
    result.classList.add(`user-form-feedback--${tone}`);
    resultIcon.className = tone === "success"
      ? "fa-solid fa-circle-check"
      : "fa-solid fa-circle-exclamation";
    const suffix = countdown === null ? "" : ` (${countdown})`;
    resultText.textContent = `${String(message || "")}${suffix}`;
    result.hidden = false;
  }

  function resetFeedback() {
    if (closeTimer) window.clearInterval(closeTimer);
    closeTimer = null;
    result.hidden = true;
    resultText.textContent = "";
    btn.disabled = false;
    btn.removeAttribute("aria-busy");
    spinner.classList.add("d-none");
  }

  // 🔮 Auto-prefill from localStorage
  try {
    const userData = localStorage.getItem("current_user");
    if (userData) {
      const user = JSON.parse(userData);
      if (user.email && !emailInput.value) {
        emailInput.value = user.email;
      }
    }
  } catch(e) {
    console.warn("No valid user data in localStorage:", e);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    resetFeedback();
    btn.disabled = true;
    btn.setAttribute("aria-busy", "true");
    spinner.classList.remove("d-none");

    const formData = new FormData(form);
    try {
      const r = await fetch(form.action, { method: "POST", body: formData });
      const data = await r.json();

      if (data.status === "OK") {
        form.reset();
        let countdown = 3;
        setFeedback("success", data.message, countdown);
        
        closeTimer = window.setInterval(() => {
          countdown--;
          setFeedback("success", data.message, countdown);
          if (countdown <= 0) {
            window.clearInterval(closeTimer);
            closeTimer = null;
            bootstrapModal.hide();
          }
        }, 1000);
      } else {
        setFeedback("error", data.message);
      }
    } catch {
      setFeedback("error", {{ _('Virhe tilauksessa. Yritä uudelleen.') | tojson }});
    } finally {
      btn.disabled = false;
      btn.removeAttribute("aria-busy");
      spinner.classList.add("d-none");
    }
  });

  modalEl.addEventListener("shown.bs.modal", () => emailInput.focus());
  modalEl.addEventListener("hidden.bs.modal", resetFeedback);
});
</script>
{% endmacro %}
