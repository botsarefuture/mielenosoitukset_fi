{% macro invite_modal(organization) %}
<!-- Invite Users Modal -->
<div class="modal fade admin-modal admin-workflow-modal" id="inviteModal" tabindex="-1" aria-labelledby="inviteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <form class="admin-form admin-workspace-form" method="POST" action="{{ url_for('admin_org.invite') }}">
        <!-- Modal Header -->
        <div class="modal-header">
          <div>
            <p class="admin-modal-kicker">{{ _('Organisaation jäsenet') }}</p>
            <h2 class="modal-title" id="inviteModalLabel">{{ _('Kutsu käyttäjä') }}</h2>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ _('Sulje') }}"></button>
        </div>

        <!-- Modal Body -->
        <div class="modal-body">
          <div class="admin-field mb-3">
            <p id="inviteHelp" class="admin-field__help">{{ _('Lähetämme käyttäjälle sähköpostitse linkin, jolla hän voi liittyä organisaatioon.') }}</p>
            <label for="invitee_email" class="form-label">{{ _('Kutsuttavan sähköpostiosoite') }} <span class="admin-required" aria-hidden="true">*</span></label>
            <input type="email" class="form-control" id="invitee_email" name="invitee_email" placeholder="nimi@example.fi" required aria-required="true" aria-describedby="inviteHelp" autocomplete="email">
          </div>
          <input type="hidden" name="organization_id" value="{{ organization._id }}">
        </div>

        <!-- Modal Footer with Equal-Sized Buttons -->
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">{{ _('Peruuta') }}</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane me-1"></i>{{ _('Lähetä kutsu') }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
{% endmacro %}
