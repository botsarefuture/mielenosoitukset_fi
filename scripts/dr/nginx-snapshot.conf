location / {
    auth_basic off;
    root /srv/dr-snapshots/prepared;
    index index.html;
    try_files $uri $uri/ =404;
    limit_except GET HEAD { deny all; }
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-DR-Fallback "snapshot" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; form-action 'none'; base-uri 'none'" always;
}
