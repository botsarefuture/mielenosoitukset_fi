server {
    server_name pentest.mielenosoitukset.fi;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/pentest.mielenosoitukset.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pentest.mielenosoitukset.fi/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Public pentest access requested by the owner; application auth still applies.
    auth_basic off;
    access_log /var/log/nginx/pentest.access.log;
    error_log /var/log/nginx/pentest.error.log;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /mirror { auth_basic off; return 301 /mirror/; }
    location ^~ /mirror/ {
        auth_basic off;
        alias /srv/dr-snapshots/prepared/;
        index index.html;
        limit_except GET HEAD { deny all; }
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:5003/mielenosoitukset.fi/;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        limit_except GET HEAD { deny all; }
    }
    location ~ /\. { deny all; }
    include /etc/nginx/snippets/dr-active.conf;
}
server {
    listen 80;
    listen [::]:80;
    server_name pentest.mielenosoitukset.fi;
    return 301 https://$host$request_uri;
}
